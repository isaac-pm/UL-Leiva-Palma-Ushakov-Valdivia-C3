# ============================================================
# Application Layer (Local Development)
# ============================================================
services:
  backend:
    image: python:3.12-slim
    container_name: hpdav-backend
    working_dir: /app
    env_file:
      - .env
    #command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && pip install debugpy &&  python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
       
    ports:
      - "8000:8000"
      - "${DEBUG_PORT:-5678}:5678"
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    container_name: hpdav-frontend
    working_dir: /app
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend